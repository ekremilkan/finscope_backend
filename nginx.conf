# Nginx Configuration for FinScope Backend
# Bu dosya sunucuya deploy ederken kullanılacak nginx konfigürasyonudur

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # Domain adınızı buraya yazın
    
    # Client max body size - Video yükleme için önemli
    client_max_body_size 100M;  # 100MB - video yükleme için yeterli
    
    # Timeout ayarları - büyük dosya yükleme için
    client_body_timeout 300s;
    client_header_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # API routes - Node.js uygulamasına proxy
    location /api/ {
        proxy_pass http://localhost:5005;  # Node.js uygulamanızın portu
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Upload için özel timeout ayarları
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Static files - Upload edilen dosyalar için
    location /uploads/ {
        alias /var/www/finscope_backend/uploads/;  # Upload klasörünün tam yolu
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Video dosyaları için özel ayarlar
        location ~* \.(mp4|avi|mov|wmv)$ {
            add_header Content-Type video/mp4;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000";
        }
        
        # Resim dosyaları için
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            add_header Cache-Control "public, max-age=31536000";
        }
        
        # CORS headers for uploads
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        
        # OPTIONS request handling
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # Proxy endpoint - CORS için
    location /api/v1/upload/proxy/ {
        proxy_pass http://localhost:5005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://localhost:5005;
        access_log off;
    }
    
    # Root location - frontend varsa
    location / {
        # Eğer frontend ayrı bir sunucuda ise
        # proxy_pass http://frontend-server;
        
        # Eğer frontend build edilmiş dosyalar varsa
        # root /var/www/finscope_frontend/dist;
        # try_files $uri $uri/ /index.html;
        
        # Şimdilik API'ye yönlendir
        return 301 /api/;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Logging
    access_log /var/log/nginx/finscope_access.log;
    error_log /var/log/nginx/finscope_error.log;
}

